apiVersion: v2
name: slipmesh
description: >-
  AmneziaWG mesh overlay with explicit link topology (mesh), BIRD OSPF/iBGP routing + bridge
  CNI conflist (router), and NAT/masquerade firewall (nftables) for the slipmesh.net
  operators, deployed as DaemonSets across Talos nodes.
type: application
version: 0.4.0
appVersion: "0.3.0"
home: https://github.com/slipmesh/helm
sources:
  - https://github.com/slipmesh/helm
  - https://github.com/slipmesh/operators
