# Structurally-valid example values for CI (helm lint/template + CRD-schema validation).
# No real secrets or infrastructure here - see README.md for the annotated version of this
# same shape, and .gitignore's .values.yaml for how a real deployment supplies its own.

nodes:
  - name: node-a
    meshLabel: node-a
    routerLabel: node-a
    endpoint: 203.0.113.1
  - name: node-b
    meshLabel: node-b
    routerLabel: node-b
    endpoint: 203.0.113.2
  - name: node-c
    meshLabel: node-c
    routerLabel: node-c
    endpoint: 203.0.113.3

mesh:
  pool:
    name: default
    network: 10.99.255.0/24
    basePort: 52800
  # h1-h4 must fit a uint32 (max 4294967295) - format: int64/maximum in crds/*.yaml.
  links:
    - pair: [node-a, node-b]
      obfuscation: { h1: 111111111, h2: 111111112, h3: 111111113, h4: 111111114 }
    - pair: [node-a, node-c]
      obfuscation: { h1: 222222221, h2: 222222222, h3: 222222223, h4: 222222224 }
    - pair: [node-b, node-c]

router:
  pool:
    name: default
    network: 10.99.0.0/24
  bypassSources:
    - node: node-a
      include:
        - kind: asn
          label: some-provider
          asns: ["AS64500"]
        - kind: literal
          prefixes:
            - net: 198.51.100.0/24
              label: "some transit block"

roadwarriors:
  nodeHostnames: ["node-a"]
  address: 192.0.2.1/24
  listenPort: 51820
  clients:
    - name: someones-phone
      publicKey: "BASE64_CLIENT_PUBLIC_KEY_HERE="
      allowedIps: ["192.0.2.10/32"]
