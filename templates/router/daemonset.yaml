apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: router
  namespace: {{ include "slipmesh.namespace" . }}
  labels:
    {{- include "slipmesh.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
        {{- include "slipmesh.labels" . | nindent 8 }}
    spec:
      serviceAccountName: router
      hostNetwork: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: router
          image: {{ .Values.image.router }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              drop: ["ALL"]
              # Only its own netlink calls (RtClient: router-lo, addresses) - BIRD itself now
              # runs in the separate "bird" container below, see operators#9.
              add: ["NET_ADMIN"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: {{ .Values.logLevel.router | quote }}
          resources:
            {{- toYaml .Values.resources.router | nindent 12 }}
          volumeMounts:
            - name: cni-net-d
              mountPath: /etc/cni/net.d
            - name: bird-conf
              mountPath: /etc/bird
            - name: bird-run
              mountPath: /run
        # BIRD's own OSPF/iBGP daemon - a separate container (not spawned by router) so its
        # release cadence and capabilities are independent of the Rust operator's, see
        # operators#9 and slipmesh/bird. Waits for router to write /etc/bird/bird.conf if it
        # starts first (see slipmesh/bird's wait-for-config patch) - no init container needed.
        - name: bird
          image: {{ .Values.image.bird }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-f", "-c", "/etc/bird/bird.conf", "-s", "/run/bird.ctl"]
          securityContext:
            capabilities:
              drop: ["ALL"]
              # NET_RAW: OSPF speaks over a raw IP socket (protocol 89), not TCP/UDP.
              # NET_BIND_SERVICE: iBGP listens on TCP/179, a privileged (<1024) port.
              # NET_ADMIN: installs routes into the kernel FIB.
              add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
          resources:
            {{- toYaml .Values.resources.bird | nindent 12 }}
          volumeMounts:
            - name: bird-conf
              mountPath: /etc/bird
            - name: bird-run
              mountPath: /run
      volumes:
        - name: cni-net-d
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: bird-conf
          emptyDir: {}
        - name: bird-run
          emptyDir: {}
