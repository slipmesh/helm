apiVersion: v1
kind: ServiceAccount
metadata:
  name: roadwarriors
  namespace: {{ include "slipmesh.namespace" . }}
---
# RoadWarrior is namespaced purely so access can be granted with an ordinary
# namespace-scoped Role instead of a cluster-wide ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roadwarriors
  namespace: {{ include "slipmesh.namespace" . }}
# Generated verbatim from roadwarriors' own API calls (roadwarriors-rbacgen) - regenerate and
# re-sync here if the operator's code changes what it reads/writes.
rules:
  - apiGroups: ["slipmesh.net"]
    resources: ["roadwarriors"]
    verbs: ["list", "watch"]
  - apiGroups: ["slipmesh.net"]
    resources: ["roadwarriors/status"]
    verbs: ["patch"]
  # RoadWarriorConfig: iface/address/listenPort/obfuscation, read once at startup (no reconcile
  # loop - list only). Mandatory, same as router's RouterConfig - exactly one object is
  # required whenever this DaemonSet actually runs (see roadwarriorconfig.yaml).
  - apiGroups: ["slipmesh.net"]
    resources: ["roadwarriorconfigs"]
    verbs: ["list"]
---
# Shared server identity (one Secret, same key on every roadwarriors pod - unlike mesh's
# per-node keys): a pod with no existing entry generates and persists one on first boot.
# `resourceNames` can't scope `create` (the object doesn't exist yet at authorization time),
# so that verb is necessarily unscoped; get/patch against an already-existing Secret are
# scoped to roadwarriors-key specifically, so roadwarriors can't touch e.g. mesh's own keys.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roadwarriors-secrets
  namespace: {{ include "slipmesh.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["roadwarriors-key"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roadwarriors-secrets
  namespace: {{ include "slipmesh.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: roadwarriors
    namespace: {{ include "slipmesh.namespace" . }}
roleRef:
  kind: Role
  name: roadwarriors-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roadwarriors
  namespace: {{ include "slipmesh.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: roadwarriors
    namespace: {{ include "slipmesh.namespace" . }}
roleRef:
  kind: Role
  name: roadwarriors
  apiGroup: rbac.authorization.k8s.io
