---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: roadwarriors.slipmesh.net
spec:
  group: slipmesh.net
  names:
    kind: RoadWarrior
    plural: roadwarriors
    shortNames:
    - rw
    singular: roadwarrior
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.allowedIps
      name: AllowedIPs
      type: string
    - jsonPath: .status.connectedNode
      name: ConnectedNode
      type: string
    - jsonPath: .status.lastHandshakeTime
      name: LastHandshake
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RoadWarriorSpec via `CustomResource`
        properties:
          spec:
            description: |-
              One road-warrior client peer. Only `public_key` and `allowed_ips` live here - the client's
              own private key never touches the server side (standard WireGuard asymmetry). `metadata.name`
              is a human label, not tied to any node - a client can roam and connect to whichever
              roadwarriors instance is reachable.
            properties:
              allowedIps:
                description: |-
                  CIDR entries, e.g. "10.99.0.5/32" - a list (not a delimited string) matching AmneziaWG's
                  own netlink AllowedIps attribute shape, with per-entry `format: cidr` validation. First
                  entry becomes the client's own tunnel address when rendering a client config.
                items:
                  format: cidr
                  type: string
                type: array
              publicKey:
                type: string
            required:
            - allowedIps
            - publicKey
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectedNode:
                description: |-
                  Which node this client currently has a fresh (non-stale) handshake with - status only,
                  not authoritative for routing (kernel routes + BIRD `learn` + iBGP handle that).
                nullable: true
                type: string
              lastHandshakeTime:
                description: RFC3339, formatted via `jiff::Timestamp` (see `handshake.rs`'s `one_pass`).
                format: date-time
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: RoadWarrior
        type: object
    served: true
    storage: true
    subresources:
      status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: roadwarriorconfigs.slipmesh.net
spec:
  group: slipmesh.net
  names:
    kind: RoadWarriorConfig
    plural: roadwarriorconfigs
    shortNames:
    - rwcfg
    singular: roadwarriorconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RoadWarriorConfigSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Cluster-wide roadwarriors device settings - a single instance expected per namespace, same
              convention as router's `RouterConfig` (mandatory, exactly one). No status/reconcile loop:
              roadwarriors reads this once at startup - changing any field here requires a pod restart to
              take effect, same as it did back when these were env vars.
            properties:
              address:
                description: |-
                  The interface's own address, as a CIDR (e.g. `172.22.0.1/24`) - the road-warrior client
                  pool's gateway. Was previously the `ROADWARRIORS_ADDRESS` env var. Required: there's no
                  meaningful default network to fall back to.
                type: string
              handshakeStaleSeconds:
                description: |-
                  How long since a client's last handshake before its kernel route is torn down - `None`
                  means "use the built-in default" (currently 180s), decided in `roadwarriors`' own code,
                  not here. Was previously the `ROADWARRIORS_HANDSHAKE_STALE` env var - unlike
                  `iface`/`address`/`listenPort`, this is a pure tuning knob with a sensible built-in
                  default, so it stays optional. `format = "int64"`: same non-standard-"uint64" fix as
                  `RouterConfig.bypassRefreshIntervalSeconds`, including the same 10-years-in-seconds `max`
                  instead of the exact `i64::MAX` (see that field's own doc comment for why - the exact
                  bound doesn't round-trip through YAML the way `helm`'s CI validator reads it).
                format: int64
                maximum: 315360000.0
                minimum: 0.0
                nullable: true
                type: integer
              iface:
                description: |-
                  WireGuard interface name roadwarriors creates/manages. Was previously the
                  `ROADWARRIORS_IFACE` env var. No sensible built-in default that wouldn't risk colliding
                  with something else on the host, so this is required, not optional.
                type: string
              listenPort:
                description: |-
                  UDP port the interface listens on for inbound client connections. Was previously the
                  `ROADWARRIORS_LISTEN_PORT` env var. Required, and `min = 1` for the same reason
                  `RouterConfig::bgp_as` excludes 0 - schemars' derived `minimum` for a `u16` is 0, a valid
                  `u16` but not a usable listen port. `format = "int32"`: schemars' own derived format for a
                  `u16` is the non-standard "uint16" (not a real OpenAPI/Kubernetes format), which the
                  apiserver accepts but warns about - `int32` comfortably covers every `u16` value.
                format: int32
                maximum: 65535.0
                minimum: 1.0
                type: integer
              obfuscation:
                default: {}
                description: |-
                  Device-level AmneziaWG obfuscation for the whole roadwarriors interface - was previously 9
                  separate `ROADWARRIORS_OBFUSCATION_*` env vars, hand-parsed one by one.
                  `crate::mesh_types::Obfuscation` is already CRD-embeddable (`MeshLinkSpec.obfuscation`
                  uses it the same way) - this reuses it instead of reimplementing the same config surface
                  as raw env parsing. Optional: empty keeps the interface wire-compatible with ordinary
                  WireGuard clients, matching the prior behavior of every `ROADWARRIORS_OBFUSCATION_*` env
                  var being unset.
                properties:
                  h1:
                    format: int64
                    maximum: 4294967295.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  h2:
                    format: int64
                    maximum: 4294967295.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  h3:
                    format: int64
                    maximum: 4294967295.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  h4:
                    format: int64
                    maximum: 4294967295.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  jc:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  jmax:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  jmin:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  s1:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  s2:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
            required:
            - address
            - iface
            - listenPort
            type: object
        required:
        - spec
        title: RoadWarriorConfig
        type: object
    served: true
    storage: true

